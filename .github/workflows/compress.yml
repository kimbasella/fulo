name: Compress Assets
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y brotli gzip
        
    - name: Compress files
      run: |
        find . -type f -name "*.html" -exec gzip -k {} \;
        find . -type f -name "*.css" -exec gzip -k {} \;
        find . -type f -name "*.js" -exec gzip -k {} \;
        find . -type f -name "*.html" -exec brotli -k {} \;
        find . -type f -name "*.css" -exec brotli -k {} \;
        find . -type f -name "*.js" -exec brotli -k {} \;
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ 