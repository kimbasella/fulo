<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FulO Logo Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }

        .logo-container {
            width: 1200px;
            height: 630px;
            background: linear-gradient(45deg, #000000, #111111);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 240px;
            font-weight: 700;
            display: flex;
            line-height: 1;
        }

        .ful {
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .o {
            color: #2563eb;
            filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.3));
            /* font-weight: 800; */
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <div class="logo">
            <span class="ful">Ful</span><span class="o">O</span>
        </div>
    </div>
</body>

</html>
